<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Crea Item</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body>
        <!-- Header-->
        <header class="bg-white shadow sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <!-- Logo e titolo -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-purple-600 rounded-lg flex items-center justify-center">
                        <i class="fas fa-palette text-white"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800">Crea Items</h1>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-3xl mx-auto px-4 py-8">
            <div class="mb-6">
                <a href="/marketplace/homepage" class="text-purple-600 hover:text-purple-800 flex items-center">
                    <i class="fas fa-arrow-left mr-2"></i> Torna alla Homepage
                </a>
            </div>

            <div class="bg-white rounded-2xl shadow-lg p-8">
                <h2 class="text-3xl font-bold text-gray-800 mb-2">Nuovo Contenuto</h2>
                <p class="text-gray-500 mb-8">Crea un nuovo Item e rendilo disponibile per l'ecosistema ArtAround Marketplace.</p>

                <form x-data="itemCreator()" @submit.prevent="submitItem">
                    <div class="space-y-6">
                        <!-- Item type -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Tipo Item</label>
                            <div class="grid grid-cols-3 gap-4">
                                <template x-for="type in ['artwork', 'artist', 'style']">
                                    <button type="button" 
                                        @click="formData.itemType = type"
                                        :class="formData.itemType === type ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-600'"
                                        class="py-2 px-4 rounded-lg capitalize transition"
                                        x-text="type === 'artwork' ? 'Opera' : (type === 'artist' ? 'Artista' : 'Stile')">
                                    </button>
                                </template>
                            </div>
                        </div>
                        
                        <!-- Search Item's OBJECT(from DB or Wikidata) -->
                        <div class="relative">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Cerca autore, movimento, o stile (DB o Wikidata)</label>
                            <div class="flex gap-2">
                                <input type="text" x-model="searchQuery" @input.debounce.500ms="search"
                                    class="flex-1 border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-purple-500 outline-none"
                                    placeholder="Es: Caravaggio, Impressionismo...">
                            </div>
                            
                            <!-- Dropdown menu for the results -->
                            <div x-show="results.length > 0" class="absolute z-10 w-full bg-white border rounded-lg mt-1 shadow-xl max-h-60 overflow-y-auto">
                                <template x-for="res in results">
                                    <div @click="selectSubject(res)" @click.away="results = []" class="p-3 hover:bg-purple-50 cursor-pointer flex justify-between border-b last:border-0">
                                        <div>
                                            <span class="font-bold text-gray-800" x-text="res.name"></span>
                                            <p class="text-xs text-gray-500" x-text="res.description || ''"></p>
                                        </div>
                                        <span class="text-[10px] uppercase font-bold px-2 py-1 bg-gray-100 rounded self-center" x-text="res.source"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <hr class="my-8">

                    <div class="grid md:grid-cols-2 gap-6 mb-6">
                        <!-- Description length -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Lunghezza Contenuto</label>
                            <select x-model="formData.length" class="w-full border rounded-lg p-3">
                                <option value="3s">3 Secondi (Titolo/Flash)</option>
                                <option value="15s">15 Secondi (Breve)</option>
                                <option value="1min">1 Minuto (Approfondito)</option>
                                <option value="4min">4 Minuti (Specialistico)</option>
                            </select>
                        </div>
                        <!-- Description lang lvl -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Target Audience</label>
                            <select x-model="formData.languageLevel" class="w-full border rounded-lg p-3">
                                <option value="infantile">Infantile / Bambini</option>
                                <option value="elementare">Semplice / Turista</option>
                                <option value="medio">Intermedio</option>
                                <option value="specialistico">Specialistico / Esperto</option>
                            </select>
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="mb-8">
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-sm font-medium text-gray-700">Testo dell'Item</label>
                            <button type="button" 
                                @click="generateWithAI" 
                                :disabled="isGeneratingAI"
                                class="text-xs font-bold px-3 py-1.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-lg hover:from-purple-700 hover:to-indigo-700 shadow-sm flex items-center gap-1.5 transition">
                                <i class="fas fa-wand-magic-sparkles" :class="isGeneratingAI ? 'fa-spin' : ''"></i>
                                <span x-text="isGeneratingAI ? 'Generazione in corso...' : 'Genera Testo con AI'"></span>
                            </button>
                        </div>
                        <div x-show="formData.isAIGenerated" class="mb-2 p-2 bg-purple-50 border border-purple-200 rounded-lg flex items-center justify-between text-xs text-purple-700">
                            <span class="flex items-center gap-1.5">
                                <i class="fas fa-robot"></i> Contenuto generato con AI • <code class="font-mono">autore_contenuto: "AI"</code>
                            </span>
                            <span class="font-semibold text-[10px] bg-purple-200 px-2 py-0.5 rounded">AI Generated</span>
                        </div>
                        <textarea x-model="formData.description" rows="6" 
                            class="w-full border border-gray-300 rounded-lg p-4 focus:ring-2 focus:ring-purple-500 outline-none"
                            placeholder="Scrivi qui la tua spiegazione oppure clicca 'Genera Testo con AI'..."></textarea>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="w-full bg-purple-600 text-white font-bold py-4 rounded-xl hover:bg-purple-700 shadow-lg transition duration-300 flex items-center justify-center">
                        <i class="fas fa-cloud-upload-alt mr-2"></i> Pubblica nel Marketplace
                    </button>
                </form>
            </div>
        </main>

        <!-- FOOTER -->
        <footer class="bg-gray-800 text-white py-8 mt-12">
            <div class="max-w-6xl mx-auto px-4 text-center text-sm text-gray-400">
                <p>ArtAround Marketplace - Esplora l'arte in modo personalizzato</p>
            </div>
        </footer>


        <script>
            function itemCreator() {
                return {
                    // Item's related info SEARCH STATE
                    searchQuery: '',
                    results: [],
                    isSearching: false,
                    isGeneratingAI: false,

                    // form data to be sent to the server
                    formData: {
                        itemType: 'artwork', 
                        subjectId: '',     // ID da Wikidata o DB Locale
                        title: '',          
                        description: '',    
                        length: '15s',
                        languageLevel: 'infantile',
                        museum: '',         
                        license: 'Proprietary',
                        isAIGenerated: false,
                        price: 0
                    },

                    async generateWithAI() {
                        const targetName = this.formData.title || this.searchQuery;
                        if (!targetName) {
                            alert("Seleziona o cerca prima un'opera o un autore per generare la descrizione.");
                            return;
                        }
                        this.isGeneratingAI = true;
                        try {
                            const res = await fetch('/api/v1/navigator/ai/generate-item', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    title: targetName,
                                    author: this.formData.author || 'Artista',
                                    style: this.formData.style || 'Pittura',
                                    length: this.formData.length,
                                    languageLevel: this.formData.languageLevel
                                })
                            });
                            const data = await res.json();
                            if (data && data.description) {
                                this.formData.description = data.description;
                                this.formData.isAIGenerated = true;
                            }
                        } catch (e) {
                            console.error("AI Generation Error:", e);
                            alert("Impossibile contattare il motore AI.");
                        } finally {
                            this.isGeneratingAI = false;
                        }
                    },

                    // Inizializzazione: recupera i dati dell'utente loggato
                    init() {
                        const userData = JSON.parse(localStorage.getItem('user'));
                        if (userData && userData.museumId) {
                            this.formData.creatorId = userData.id;
                            this.formData.museum = userData.museumId; 
                        }
                    },

                    // Logica di ricerca (Locale + Fallback Wikidata)
                    async search() {
                        if (this.searchQuery.length < 3) {
                            this.results = [];
                            return;
                        }

                        this.isSearching = true;
                        try {
                            // 1. Cerca nel tuo Database Locale
                            /* TODO: connessione server endpoint per ricerca autori (es: /api/v1/marketplace/search-authors?q=caravaggio)

                            const localResponse = await fetch(`/api/v1/marketplace/search-authors?q=${this.searchQuery}`);
                            const localData = await localResponse.json();
                            let combinedResults = (localData.authors || []).map(a => ({
                                id: a.id,
                                name: a.name,
                                description: 'Contenuto già presente nel sistema',
                                source: 'ArtAround'
                            }));*/
                            
                            let combinedResults = []
                            // 2. Se pochi risultati locali, cerca su Wikidata
                            if (combinedResults.length < 3) {
                                const wikiUrl = `https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(this.searchQuery)}&language=it&format=json&origin=*`;
                                const wikiResponse = await fetch(wikiUrl);
                                const wikiData = await wikiResponse.json();
                                console.log("Risultati Wikidata:", wikiData);

                                const wikiResults = (wikiData.search || []).map(i => ({
                                    id: i.id,
                                    name: i.label,
                                    description: i.description,
                                    source: 'Wikidata'
                                }));
                                
                                combinedResults = [...combinedResults, ...wikiResults];
                            }

                            this.results = combinedResults;
                        } catch (err) {
                            console.error("Errore durante la ricerca:", err);
                        } finally {
                            this.isSearching = false;
                        }
                    },

                    // Selezione del soggetto dalla lista(onclick del risultato dal dropdown)
                    selectSubject(item) {
                        this.formData.subjectId = item.id;
                        this.formData.title = item.name;
                        this.searchQuery = item.name;
                        this.results = []; // Chiude il dropdown
                        console.log("Soggetto selezionato:", this.formData.title, "ID:", this.formData.subjectId);
                    },

                    // Invio finale dei dati al server
                    async submitItem() {
                        // Validazione minima
                        if (!this.formData.subjectId || !this.formData.description) {
                            alert("Per favore, seleziona un soggetto e inserisci una descrizione.");
                            return;
                        }

                        try {
                            const token = localStorage.getItem('apiToken');

                            console.log("TEST: ", token)
                            const response = await fetch('/api/v1/marketplace/create/items', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${token}`
                                },
                                body: JSON.stringify(this.formData)
                            });

                            const data = await response.json();

                            if (response.ok) {
                                alert('Ottimo! Item creato e aggiunto al marketplace.');
                                window.location.href = '/marketplace/homepage/';

                            } else {
                                alert('Errore: ' + (data.message || 'Impossibile salvare l\'item'));
                            }

                        } catch (err) {
                            console.error("Errore nell'invio della form:", err);
                            alert("Errore di connessione al server.");
                        }
                    }
                }
            }
        </script>

    </body>
</html>
