<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea Item - ArtAround Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans">
    <!-- Header-->
    <header class="bg-white shadow sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/marketplace/homepage" class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-purple-600 rounded-lg flex items-center justify-center shadow">
                    <i class="fas fa-palette text-white text-sm"></i>
                </div>
                <span class="text-xl font-bold text-gray-800 tracking-tight">ArtAround</span>
            </a>

            <div class="flex items-center space-x-6">
                <a href="/marketplace/homepage" class="text-gray-600 hover:text-purple-600 text-sm font-medium flex items-center">
                    <i class="fas fa-arrow-left mr-2"></i> Torna alla Dashboard
                </a>
                <a href="/marketplace/browseMarket" class="text-gray-600 hover:text-purple-600 text-sm font-medium">
                    Marketplace
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full" x-data="itemCreator()" x-init="init()" x-cloak>
        <div class="bg-white rounded-3xl shadow-xl p-8 border border-gray-100">
            <div class="mb-8">
                <div class="inline-flex items-center gap-2 px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-xs font-semibold uppercase tracking-wider mb-2">
                    <i class="fas fa-cube"></i> Contenuto Singolo
                </div>
                <h2 class="text-3xl font-extrabold text-gray-800 mb-1">Registra Nuovo Item / Opera</h2>
                <p class="text-gray-500 text-sm">Crea descrizioni audio, testi personalizzati e associa l'opera al tuo museo.</p>
            </div>

            <form @submit.prevent="submitItem" class="space-y-6">
                
                <!-- Museum Selection -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1.5">Museo di Riferimento <span class="text-red-500">*</span></label>
                    <select x-model="formData.museum" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-purple-500 text-sm">
                        <template x-for="m in managedMuseums" :key="m._id">
                            <option :value="m._id" x-text="m.name + ' (' + m.museumId + ')'"></option>
                        </template>
                        <template x-if="managedMuseums.length === 0">
                            <option value="PIN-BO">Pinacoteca Nazionale di Bologna (PIN-BO)</option>
                        </template>
                    </select>
                </div>

                <!-- Item type -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1.5">Tipo Item</label>
                    <div class="grid grid-cols-3 gap-3">
                        <template x-for="type in ['artwork', 'artist', 'style']">
                            <button type="button" 
                                @click="formData.itemType = type"
                                :class="formData.itemType === type ? 'bg-purple-600 text-white font-bold shadow' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
                                class="py-2.5 px-4 rounded-xl text-sm capitalize transition"
                                x-text="type === 'artwork' ? 'Opera d\'Arte' : (type === 'artist' ? 'Artista' : 'Movimento / Stile')">
                            </button>
                        </template>
                    </div>
                </div>
                
                <!-- Search Item's OBJECT (Wikidata) -->
                <div class="relative">
                    <label class="block text-xs font-bold text-gray-700 mb-1.5">Cerca su Wikidata o Inserisci Titolo</label>
                    <div class="relative">
                        <input type="text" x-model="searchQuery" @input.debounce.400ms="search"
                            class="w-full border border-gray-300 rounded-xl px-4 py-3 pl-10 focus:ring-2 focus:ring-purple-500 outline-none text-sm"
                            placeholder="Es: Raffaello Sanzio, Pala di Santa Cecilia, Caravaggio...">
                        <i class="fas fa-search absolute left-3.5 top-4 text-gray-400 text-sm"></i>
                        <i x-show="isSearching" class="fas fa-spinner fa-spin absolute right-3.5 top-4 text-purple-500 text-sm"></i>
                    </div>
                    
                    <!-- Dropdown results -->
                    <div x-show="results.length > 0" @click.away="results = []" class="absolute z-20 w-full bg-white border border-gray-200 rounded-2xl mt-1 shadow-2xl max-h-60 overflow-y-auto">
                        <template x-for="res in results" :key="res.id">
                            <div @click="selectSubject(res)" class="p-3 hover:bg-purple-50 cursor-pointer flex justify-between border-b border-gray-100 last:border-0 transition">
                                <div class="min-w-0 pr-2">
                                    <div class="font-bold text-gray-800 text-sm" x-text="res.name"></div>
                                    <p class="text-xs text-gray-500 truncate" x-text="res.description || ''"></p>
                                </div>
                                <span class="text-[10px] font-bold px-2 py-0.5 bg-purple-100 text-purple-700 rounded self-center flex-shrink-0" x-text="res.id"></span>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Custom Title & Price -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1.5">Titolo Visualizzato <span class="text-red-500">*</span></label>
                        <input type="text" x-model="formData.title" required class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-purple-500 outline-none" placeholder="Titolo dell'opera">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1.5">Prezzo Singolo (€)</label>
                        <input type="number" step="0.5" min="0" x-model="formData.price" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-purple-500 outline-none" placeholder="0 per gratuito">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1.5">Lunghezza Audio</label>
                        <select x-model="formData.length" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-purple-500">
                            <option value="15s">15 Secondi (Flash)</option>
                            <option value="1m">1 Minuto (Standard)</option>
                            <option value="3m">3 Minuti (Approfondito)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1.5">Target Audience</label>
                        <select x-model="formData.languageLevel" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-purple-500">
                            <option value="infantile">Bambini / Ragazzi</option>
                            <option value="medio">Generale / Turista</option>
                            <option value="specialistico">Specialistico / Esperti</option>
                        </select>
                    </div>
                </div>

                <!-- Description & AI Generator -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-bold text-gray-700">Descrizione Audio / Testo Informativo <span class="text-red-500">*</span></label>
                        <button type="button" 
                            @click="generateWithAI" 
                            :disabled="isGeneratingAI"
                            class="text-xs font-bold px-3 py-1.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl hover:from-purple-700 hover:to-indigo-700 shadow-sm flex items-center gap-1.5 transition disabled:opacity-50">
                            <i class="fas fa-wand-magic-sparkles" :class="isGeneratingAI ? 'fa-spin' : ''"></i>
                            <span x-text="isGeneratingAI ? 'Generazione...' : 'Genera con AI'"></span>
                        </button>
                    </div>

                    <div x-show="formData.isAIGenerated" class="mb-2 p-2.5 bg-purple-50 border border-purple-200 rounded-xl flex items-center justify-between text-xs text-purple-700">
                        <span class="flex items-center gap-1.5">
                            <i class="fas fa-robot"></i> Testo generato con AI Assistant
                        </span>
                        <span class="font-bold text-[10px] bg-purple-200 text-purple-800 px-2 py-0.5 rounded-full">AI Powered</span>
                    </div>

                    <textarea x-model="formData.description" rows="5" required
                        class="w-full border border-gray-300 rounded-xl p-4 text-sm focus:ring-2 focus:ring-purple-500 outline-none"
                        placeholder="Inserisci la spiegazione per il visitatore oppure clicca su 'Genera con AI'..."></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" :disabled="isSubmitting" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-4 rounded-2xl hover:shadow-xl transition flex items-center justify-center gap-2 text-sm disabled:opacity-50">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span x-text="isSubmitting ? 'Salvataggio...' : 'Pubblica Item nel Marketplace'"></span>
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-gray-800 text-white py-8 mt-12">
        <div class="max-w-6xl mx-auto px-4 text-center text-xs text-gray-400">
            <p>ArtAround Marketplace - Esplora l'arte in modo personalizzato</p>
        </div>
    </footer>

    <script>
        function itemCreator() {
            return {
                searchQuery: '',
                results: [],
                isSearching: false,
                isGeneratingAI: false,
                isSubmitting: false,
                managedMuseums: [],

                formData: {
                    itemType: 'artwork', 
                    subjectId: '',
                    title: '',          
                    description: '',    
                    length: '15s',
                    languageLevel: 'medio',
                    museum: '',         
                    license: 'CC-BY-SA',
                    isAIGenerated: false,
                    price: 0
                },

                async init() {
                    const userData = JSON.parse(localStorage.getItem('user') || localStorage.getItem('userData') || '{}');
                    if (!userData.role) {
                        window.location.href = '/marketplace/login';
                        return;
                    }
                    if (userData.role !== 'creator') {
                        alert("Accesso limitato: solo i Creatori possono registrare nuovi items.");
                        window.location.href = '/marketplace/homepage';
                        return;
                    }

                    await this.loadManagedMuseums();
                },

                async loadManagedMuseums() {
                    try {
                        const token = localStorage.getItem('apiToken') || localStorage.getItem('token');
                        const res = await fetch('/api/v1/marketplace/museums/getManaged', {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (res.ok) {
                            const json = await res.json();
                            this.managedMuseums = json.data || [];
                            if (this.managedMuseums.length > 0) {
                                this.formData.museum = this.managedMuseums[0]._id;
                            }
                        }
                    } catch (e) {
                        console.error("Errore caricamento musei:", e);
                    }
                },

                async generateWithAI() {
                    const targetName = this.formData.title || this.searchQuery;
                    if (!targetName) {
                        alert("Seleziona o scrivi prima il titolo dell'opera.");
                        return;
                    }
                    this.isGeneratingAI = true;
                    try {
                        const res = await fetch('/api/v1/navigator/ai/generate-item', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                title: targetName,
                                length: this.formData.length,
                                languageLevel: this.formData.languageLevel
                            })
                        });
                        const data = await res.json();
                        if (data && data.description) {
                            this.formData.description = data.description;
                            this.formData.isAIGenerated = true;
                        }
                    } catch (e) {
                        console.error("AI Generation Error:", e);
                        alert("Impossibile generare la descrizione con AI al momento.");
                    } finally {
                        this.isGeneratingAI = false;
                    }
                },

                async search() {
                    if (this.searchQuery.length < 3) {
                        this.results = [];
                        return;
                    }

                    this.isSearching = true;
                    try {
                        const wikiUrl = `https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(this.searchQuery)}&language=it&format=json&origin=*`;
                        const wikiResponse = await fetch(wikiUrl);
                        const wikiData = await wikiResponse.json();

                        this.results = (wikiData.search || []).map(i => ({
                            id: i.id,
                            name: i.label,
                            description: i.description || 'Entità Wikidata',
                            source: 'Wikidata'
                        }));
                    } catch (err) {
                        console.error("Errore ricerca Wikidata:", err);
                    } finally {
                        this.isSearching = false;
                    }
                },

                selectSubject(item) {
                    this.formData.subjectId = item.id;
                    this.formData.title = item.name;
                    this.searchQuery = item.name;
                    this.results = [];
                },

                async submitItem() {
                    if (!this.formData.title || !this.formData.description) {
                        alert("Compila il titolo e la descrizione dell'item.");
                        return;
                    }

                    this.isSubmitting = true;
                    try {
                        const token = localStorage.getItem('apiToken') || localStorage.getItem('token');
                        const response = await fetch('/api/v1/marketplace/create/items', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify(this.formData)
                        });

                        const data = await response.json();

                        if (response.ok) {
                            alert('Item salvato con successo nel catalogo!');
                            window.location.href = '/marketplace/homepage';
                        } else {
                            alert('Errore: ' + (data.message || 'Impossibile salvare l\'item'));
                        }
                    } catch (err) {
                        console.error("Errore submit item:", err);
                        alert("Errore di connessione al server.");
                    } finally {
                        this.isSubmitting = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
