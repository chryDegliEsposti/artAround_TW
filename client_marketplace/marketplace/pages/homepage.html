<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ArtAround</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col" x-data="dashboard()" x-init="init()" x-cloak>
    
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <!-- Logo -->
            <a href="/marketplace/homepage" class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-purple-600 rounded-lg flex items-center justify-center shadow-md">
                    <i class="fas fa-palette text-white"></i>
                </div>
                <span class="text-2xl font-bold text-gray-800">ArtAround</span>
            </a>
            
            <!-- User Profile & Action Menu -->
            <div class="relative" x-data="{ isProfileMenuOpen: false }">
                <button @click="isProfileMenuOpen = !isProfileMenuOpen" 
                        class="flex items-center space-x-3 focus:outline-none p-1.5 rounded-xl hover:bg-gray-50 transition">
                    <span class="text-gray-600 hidden md:block text-sm">Benvenuto,</span>
                    <span class="font-bold text-purple-600 capitalize text-sm md:text-base" x-text="username || 'Ospite'"></span>
                    <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center text-purple-600 shadow-inner">
                        <i class="fas fa-user"></i>
                    </div>
                    <i class="fas fa-chevron-down text-gray-400 text-xs transition-transform"
                       :class="{ 'rotate-180': isProfileMenuOpen }"></i>
                </button>

                <!-- Profile Dropdown -->
                <div x-show="isProfileMenuOpen" @click.away="isProfileMenuOpen = false" 
                     class="absolute right-0 mt-2 w-64 bg-white rounded-xl shadow-2xl border border-gray-100 py-2 z-50 overflow-hidden">  
                    <div class="px-4 py-3 border-b border-gray-100 bg-gray-50">
                        <p class="text-xs text-gray-400 uppercase font-semibold">Profilo attivo</p>
                        <p class="font-bold text-gray-800 text-base" x-text="username"></p>
                        <p class="text-xs text-purple-600 font-medium capitalize" x-text="'Ruolo: ' + userRole"></p>
                        <p class="text-xs text-gray-500 truncate" x-text="email"></p>
                    </div>
                    
                    <a href="/marketplace/browseMarket" class="block px-4 py-3 hover:bg-purple-50 text-gray-700 text-sm flex items-center transition">
                        <i class="fas fa-store w-6 text-purple-500"></i>
                        <span>Marketplace</span>
                    </a>
                    
                    <a href="/navigator/my-visits" class="block px-4 py-3 hover:bg-purple-50 text-gray-700 text-sm flex items-center transition">
                        <i class="fas fa-ticket-alt w-6 text-blue-500"></i>
                        <span>I miei Tour Acquistati</span>
                    </a>

                    <a href="/navigator" class="block px-4 py-3 hover:bg-purple-50 text-gray-700 text-sm flex items-center transition">
                        <i class="fas fa-map-marked-alt w-6 text-green-500"></i>
                        <span>Mappa Navigator</span>
                    </a>
                    
                    <div class="border-t border-gray-100 my-1"></div>
                    
                    <button @click="handleLogout" 
                            class="w-full text-left px-4 py-3 hover:bg-red-50 text-red-600 text-sm flex items-center transition">
                        <i class="fas fa-sign-out-alt w-6"></i>
                        <span>Esci (Logout)</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation Bar -->
    <nav class="bg-gray-800 text-white sticky top-16 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-4">
            <div class="flex items-center space-x-6 flex-wrap">
                <a href="/marketplace/homepage" class="hover:text-purple-400 text-sm font-medium flex items-center text-purple-300">
                    <i class="fas fa-chart-pie mr-2"></i>Dashboard
                </a>

                <a href="/marketplace/browseMarket" class="hover:text-purple-400 text-sm font-medium flex items-center">
                    <i class="fas fa-search mr-2"></i>Browse Contenuti
                </a>

                <a href="/navigator" class="hover:text-purple-400 text-sm font-medium flex items-center text-yellow-300">
                    <i class="fas fa-compass mr-2"></i>ArtAround Navigator
                </a>

                <!-- CREATOR ONLY MENUS -->
                <template x-if="userRole === 'creator'"> 
                    <div class="inline-flex items-center space-x-6 flex-wrap">
                        <a href="/navigator/editor" class="hover:text-purple-400 text-sm font-medium flex items-center">
                            <i class="fas fa-drafting-compass mr-2 text-indigo-400"></i>Editor Piantina
                        </a>

                        <!-- Dropdown Crea Contenuti -->
                        <div class="relative" x-data="{ isCreateMenuOpen: false }">
                            <button @click="isCreateMenuOpen = !isCreateMenuOpen" 
                                    class="hover:text-purple-400 text-sm font-medium flex items-center focus:outline-none">
                                <i class="fas fa-plus-circle mr-2 text-green-400"></i>
                                Crea Contenuti
                                <i class="fas fa-chevron-down ml-1.5 text-xs transition-transform" :class="{ 'rotate-180': isCreateMenuOpen }"></i>
                            </button>

                            <div x-show="isCreateMenuOpen"
                                 @click.away="isCreateMenuOpen = false"
                                 class="absolute left-0 mt-2 w-52 bg-white rounded-xl shadow-xl border border-gray-100 py-1.5 z-50">
                                
                                <a href="/marketplace/homepage/createItems" 
                                   @click="isCreateMenuOpen = false"
                                   class="block px-4 py-2.5 hover:bg-purple-50 text-gray-700 text-sm flex items-center">
                                    <i class="fas fa-cube mr-3 text-blue-500"></i>Crea Items (Opere)
                                </a>
                                
                                <a href="/marketplace/homepage/createVisits" 
                                   @click="isCreateMenuOpen = false"
                                   class="block px-4 py-2.5 hover:bg-purple-50 text-gray-700 text-sm flex items-center border-t border-gray-100">
                                    <i class="fas fa-route mr-3 text-green-500"></i>Imposta Percorso Visita
                                </a>
                            </div>
                        </div>
                        
                        <!-- Dropdown Musei -->
                        <div class="relative" x-data="{ isMuseumMenuOpen: false }">
                            <button @click="isMuseumMenuOpen = !isMuseumMenuOpen" 
                                    class="hover:text-purple-400 text-sm font-medium flex items-center focus:outline-none">
                                <i class="fas fa-university mr-2 text-purple-400"></i>
                                I Miei Musei
                                <i class="fas fa-chevron-down ml-1.5 text-xs transition-transform" :class="{ 'rotate-180': isMuseumMenuOpen }"></i>
                            </button>

                            <div x-show="isMuseumMenuOpen"
                                 @click.away="isMuseumMenuOpen = false"
                                 class="absolute left-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-gray-100 py-1.5 z-50">
                                
                                <a href="/marketplace/homepage/newMuseum" 
                                   @click="isMuseumMenuOpen = false"
                                   class="block px-4 py-2.5 hover:bg-purple-50 text-gray-700 text-sm flex items-center">
                                    <i class="fas fa-plus-circle mr-3 text-purple-500"></i>Registra Nuovo Museo
                                </a>

                                <a href="/marketplace/homepage/joinMuseum" 
                                   @click="isMuseumMenuOpen = false"
                                   class="block px-4 py-2.5 hover:bg-purple-50 text-gray-700 text-sm flex items-center border-t border-gray-100">
                                    <i class="fas fa-handshake mr-3 text-blue-600"></i>Unisciti a una Struttura
                                </a>

                                <a href="/marketplace/homepage/myMuseums" 
                                   @click="isMuseumMenuOpen = false"
                                   class="block px-4 py-2.5 hover:bg-purple-50 text-gray-700 text-sm flex items-center border-t border-gray-100">
                                    <i class="fas fa-list-check mr-3 text-green-600"></i>Gestione Collaborazioni
                                </a>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- VISITOR ONLY QUICK LINKS -->
                <template x-if="userRole === 'visitor'">
                    <div class="inline-flex items-center space-x-6">
                        <a href="/navigator/my-visits" class="hover:text-purple-400 text-sm font-medium flex items-center text-pink-300">
                            <i class="fas fa-ticket-alt mr-2"></i>I miei Tour
                        </a>
                    </div>
                </template>
            </div>

            <!-- Notifications Bell -->
            <div x-data="notificationManager()" class="relative ml-auto">
                <button @click="open = !open" class="relative p-2 text-gray-300 hover:text-purple-400 focus:outline-none">
                    <i class="fas fa-bell text-lg"></i>
                    <template x-if="unreadCount > 0">
                        <span class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-0.5 text-[10px] font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-red-600 rounded-full" 
                              x-text="unreadCount">
                        </span>
                    </template>
                </button>

                <div x-show="open" 
                     @click.away="open = false"
                     class="absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-2xl border border-gray-100 z-50 overflow-hidden text-gray-800">
                    
                    <div class="p-3 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                        <span class="font-bold text-sm text-gray-800">Notifiche</span>
                        <span class="text-xs text-purple-600 font-semibold" x-text="unreadCount + ' nuove'"></span>
                    </div>

                    <div class="max-h-80 overflow-y-auto">
                        <template x-for="n in notifications" :key="n._id">
                            <div @click="markAsRead(n._id)" 
                                 class="p-3.5 border-b border-gray-50 cursor-pointer hover:bg-purple-50 transition"
                                 :class="n.read ? 'bg-white' : 'bg-purple-50/50'">
                                <div class="flex items-start gap-2.5">
                                    <i class="fas fa-bell mt-1 text-xs" :class="n.read ? 'text-gray-400' : 'text-purple-600'"></i>
                                    <div class="flex-1">
                                        <p class="text-xs text-gray-800 leading-snug" x-text="n.message"></p>
                                        <p class="text-[10px] text-gray-400 mt-1" x-text="new Date(n.createdAt).toLocaleDateString('it-IT')"></p>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <template x-if="notifications.length === 0">
                            <div class="p-6 text-center text-gray-400 text-xs">
                                <i class="fas fa-bell-slash text-xl mb-1 block"></i>
                                Nessuna notifica presente.
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>
    </nav>
 
    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        
        <!-- ================= CREATOR VIEW ================= -->
        <template x-if="userRole === 'creator'">
            <div class="space-y-8">
                <!-- Welcome Banner -->
                <div class="bg-gradient-to-r from-purple-600 to-indigo-700 rounded-3xl text-white p-8 shadow-xl relative overflow-hidden">
                    <div class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                        <div>
                            <div class="inline-flex items-center gap-2 px-3 py-1 bg-white/20 rounded-full text-xs font-semibold uppercase tracking-wider mb-3">
                                <i class="fas fa-crown text-yellow-300"></i> Account Creatore
                            </div>
                            <h1 class="text-3xl sm:text-4xl font-extrabold mb-2">
                                Bentornato, <span x-text="username"></span>!
                            </h1>
                            <p class="text-purple-100 text-base max-w-xl">
                                Crea percorsi museali, registra opere d'arte interattive e gestisci le strutture associate.
                            </p>
                        </div>
                        <div class="flex flex-wrap gap-3">
                            <a href="/marketplace/homepage/newMuseum" class="px-5 py-2.5 bg-white text-purple-700 font-bold rounded-xl shadow hover:bg-purple-50 transition text-sm flex items-center gap-2">
                                <i class="fas fa-plus"></i> Nuovo Museo
                            </a>
                            <a href="/marketplace/homepage/createVisits" class="px-5 py-2.5 bg-purple-500/40 text-white font-bold rounded-xl hover:bg-purple-500/60 border border-white/20 transition text-sm flex items-center gap-2">
                                <i class="fas fa-route"></i> Nuova Visita
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions Grid for Creator -->
                <div>
                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <i class="fas fa-bolt text-amber-500"></i> Strumenti Creatore
                    </h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                        <a href="/marketplace/homepage/newMuseum" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md hover:border-purple-200 transition group">
                            <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center text-xl mb-4 group-hover:scale-110 transition">
                                <i class="fas fa-university"></i>
                            </div>
                            <h3 class="font-bold text-gray-800 text-base mb-1">Registra Museo</h3>
                            <p class="text-xs text-gray-500">Aggiungi una nuova struttura con coordinate GPS e piantina 2D.</p>
                        </a>

                        <a href="/navigator/editor" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md hover:border-indigo-200 transition group">
                            <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center text-xl mb-4 group-hover:scale-110 transition">
                                <i class="fas fa-draw-polygon"></i>
                            </div>
                            <h3 class="font-bold text-gray-800 text-base mb-1">Editor Piantine</h3>
                            <p class="text-xs text-gray-500">Disegna muri, aree e punti di interesse sulle mappe indoor dei musei.</p>
                        </a>

                        <a href="/marketplace/homepage/createItems" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md hover:border-blue-200 transition group">
                            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center text-xl mb-4 group-hover:scale-110 transition">
                                <i class="fas fa-cube"></i>
                            </div>
                            <h3 class="font-bold text-gray-800 text-base mb-1">Crea Items (Opere)</h3>
                            <p class="text-xs text-gray-500">Registra descrizioni vocali con diversi livelli e assistenza AI.</p>
                        </a>

                        <a href="/marketplace/homepage/createVisits" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md hover:border-green-200 transition group">
                            <div class="w-12 h-12 bg-green-100 text-green-600 rounded-xl flex items-center justify-center text-xl mb-4 group-hover:scale-110 transition">
                                <i class="fas fa-map-marked-alt"></i>
                            </div>
                            <h3 class="font-bold text-gray-800 text-base mb-1">Componi Visite</h3>
                            <p class="text-xs text-gray-500">Crea percorsi guidati ordinando gli items e impostando prezzi.</p>
                        </a>
                    </div>
                </div>

                <!-- Managed Museums Preview -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                            <i class="fas fa-landmark text-purple-600"></i> Le Tue Strutture Gestite
                        </h2>
                        <a href="/marketplace/homepage/myMuseums" class="text-sm font-semibold text-purple-600 hover:underline">
                            Vedi tutte (<span x-text="myMuseums.length"></span>) →
                        </a>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <template x-for="m in myMuseums" :key="m._id">
                            <div class="p-4 rounded-xl border border-gray-100 bg-gray-50 hover:bg-white hover:shadow-md transition">
                                <h4 class="font-bold text-gray-800 text-base" x-text="m.name"></h4>
                                <p class="text-xs text-gray-500 mt-1" x-text="m.city + ' • Codice: ' + m.museumId"></p>
                                <div class="mt-3 flex gap-2">
                                    <a :href="'/navigator/editor?lat=' + (m.latitude || 44.4975) + '&lng=' + (m.longitude || 11.3533)" class="text-xs bg-indigo-600 text-white font-medium px-3 py-1.5 rounded-lg hover:bg-indigo-700">
                                        Modifica Piantina
                                    </a>
                                </div>
                            </div>
                        </template>

                        <template x-if="myMuseums.length === 0">
                            <div class="col-span-3 py-8 text-center text-gray-400">
                                <p class="text-sm">Non hai ancora creato o gestito nessun museo.</p>
                                <a href="/marketplace/homepage/newMuseum" class="inline-block mt-3 text-sm font-bold text-purple-600 hover:underline">
                                    + Registra il tuo primo museo
                                </a>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- ================= VISITOR VIEW ================= -->
        <template x-if="userRole === 'visitor'">
            <div class="space-y-8">
                <!-- Visitor Welcome Banner -->
                <div class="bg-gradient-to-r from-blue-600 to-purple-600 rounded-3xl text-white p-8 shadow-xl">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                        <div>
                            <div class="inline-flex items-center gap-2 px-3 py-1 bg-white/20 rounded-full text-xs font-semibold uppercase tracking-wider mb-3">
                                <i class="fas fa-compass text-yellow-300"></i> Account Visitatore
                            </div>
                            <h1 class="text-3xl sm:text-4xl font-extrabold mb-2">
                                Ciao, <span x-text="username"></span>!
                            </h1>
                            <p class="text-blue-100 text-base max-w-xl">
                                Scopri capolavori, acquista guide personalizzate ed esplora i musei con la navigazione indoor intelligente.
                            </p>
                        </div>
                        <div class="flex flex-wrap gap-3">
                            <a href="/marketplace/browseMarket" class="px-6 py-3 bg-white text-blue-700 font-bold rounded-xl shadow hover:bg-blue-50 transition text-sm flex items-center gap-2">
                                <i class="fas fa-store"></i> Sfoglia Visite
                            </a>
                            <a href="/navigator" class="px-6 py-3 bg-blue-500/40 text-white font-bold rounded-xl hover:bg-blue-500/60 border border-white/20 transition text-sm flex items-center gap-2">
                                <i class="fas fa-location-arrow"></i> Apri Navigator
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Quick Action Cards for Visitor -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <a href="/marketplace/browseMarket" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-lg transition group">
                        <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center text-xl mb-4 group-hover:scale-110 transition">
                            <i class="fas fa-store"></i>
                        </div>
                        <h3 class="font-bold text-gray-800 text-lg mb-1">Marketplace Visite</h3>
                        <p class="text-sm text-gray-500">Esplora percorsi tematici, descrizioni delle opere e acquista le visite che preferisci.</p>
                    </a>

                    <a href="/navigator/my-visits" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-lg transition group">
                        <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center text-xl mb-4 group-hover:scale-110 transition">
                            <i class="fas fa-ticket-alt"></i>
                        </div>
                        <h3 class="font-bold text-gray-800 text-lg mb-1">I Tuoi Tour Acquistati</h3>
                        <p class="text-sm text-gray-500">Accedi alle visite che hai già comprato per iniziare subito la tua esperienza museale.</p>
                    </a>

                    <a href="/navigator" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-lg transition group">
                        <div class="w-12 h-12 bg-green-100 text-green-600 rounded-xl flex items-center justify-center text-xl mb-4 group-hover:scale-110 transition">
                            <i class="fas fa-map-marked-alt"></i>
                        </div>
                        <h3 class="font-bold text-gray-800 text-lg mb-1">ArtAround Navigator</h3>
                        <p class="text-sm text-gray-500">Trova i musei più vicini alla tua posizione con la geolocalizzazione GPS in tempo reale.</p>
                    </a>
                </div>
            </div>
        </template>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8 mt-12">
        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4 text-center md:text-left">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center">
                    <i class="fas fa-palette text-white text-xs"></i>
                </div>
                <span class="text-lg font-bold">ArtAround Marketplace</span>
            </div>
            <p class="text-xs text-gray-400">Esplora l'arte in modo personalizzato con Navigator e Generative AI.</p>
        </div>
    </footer>

    <script>
        function dashboard() {
            return {
                userRole: 'visitor',
                username: '',
                email: '',
                myMuseums: [],
                
                async init() {
                    const userData = JSON.parse(localStorage.getItem('user') || localStorage.getItem('userData') || '{}');
                    this.userRole = userData.role || 'visitor';
                    this.username = userData.username || 'Utente';
                    this.email = userData.email || '';
                    
                    if (this.userRole === 'creator') {
                        await this.loadMyMuseums();
                    }
                },

                async loadMyMuseums() {
                    try {
                        const token = localStorage.getItem('apiToken') || localStorage.getItem('token');
                        const res = await fetch('/api/v1/marketplace/museums/getManaged', {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (res.ok) {
                            const json = await res.json();
                            this.myMuseums = json.data || [];
                        }
                    } catch (err) {
                        console.error('Errore caricamento musei:', err);
                    }
                },

                async handleLogout() {
                    if (confirm('Sei sicuro di voler uscire?')) {
                        try {
                            await fetch('/api/v1/auth/logout'); 
                            localStorage.clear();
                            window.location.href = '/marketplace/login';
                        } catch (err) {
                            console.error('Logout error: ', err);
                            localStorage.clear();
                            window.location.href = '/marketplace/login';
                        }
                    }
                }
            }
        }

        function notificationManager() {
            return {
                notifications: [],
                open: false,
                
                async init() {
                    await this.fetchNotifications();
                    setInterval(() => this.fetchNotifications(), 30000);
                },

                async fetchNotifications() {
                    try {
                        const token = localStorage.getItem('apiToken') || localStorage.getItem('token');
                        if (!token) return;
                        const res = await fetch('/api/v1/marketplace/notifications', {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (res.ok) {
                            const json = await res.json();
                            if (json.status === 'success') {
                                this.notifications = json.data || [];
                            }
                        }
                    } catch (err) {
                        console.error("Errore recupero notifiche:", err);
                    }
                },

                get unreadCount() {
                    return this.notifications.filter(n => !n.read).length;
                },

                async markAsRead(id) {
                    try {
                        const token = localStorage.getItem('apiToken') || localStorage.getItem('token');
                        await fetch(`/api/v1/marketplace/notifications/markAsRead/${id}`, {
                            method: 'PATCH',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const notif = this.notifications.find(n => n._id === id);
                        if (notif) notif.read = true;
                    } catch (err) {
                        console.error("Errore lettura notifica:", err);
                    }
                }
            }
        }
    </script>
</body>
