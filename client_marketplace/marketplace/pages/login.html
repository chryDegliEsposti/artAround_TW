<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>

<body class="bg-gray-50 min-h-screen">
    
    <!-- NAVBAR -->
    <nav class="sticky top-0 z-50 bg-gray-100 shadow-lg">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                
                <!-- Logo che porta alla home -->
                <a href="/marketplace" class="flex items-center space-x-2">
                    <div class="w-7 h-7 sm:w-8 sm:h-8 bg-purple-600 rounded-lg flex items-center justify-center">
                        <i class="text-white text-xs">AA</i>
                    </div>
                    <span class="text-l sm:text-xl lg:text-2xl font-bold text-gray-800 hover:text-purple-600">Marketplace</span>
                </a>

                <!-- Link per tornare alla home -->
                <div class="hidden md:flex items-center space-x-6">
                    <a href="/marketplace" class="text-gray-600 hover:text-purple-600">
                        <i class="fas fa-arrow-left mr-2"></i>Torna alla Home
                    </a>
                </div>

                <!-- Non hai un account? -->
                <div class="hidden md:flex items-center space-x-2">
                    <span class="text-gray-600">Non hai un account?</span>
                    <a href="/marketplace/registration">
                        <button class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                            Registrati
                        </button>
                    </a>
                </div>

            </div>
        </div>
    </nav>

    <!-- Form -->
    <section class="py-12">
        <div class="max-w-4xl mx-auto px-4">
            
            <!-- Header -->
            <div class="text-center mb-10">
                <h1 class="text-4xl font-bold text-gray-800 mb-4">
                    Bentornato alla community ArtAround!
                </h1>
                <p class="text-gray-600 text-lg">
                    Accedi al tuo profilo per esplorare, acquistare e vendere opere d'arte uniche.
                </p>
            </div>

            <div class="flex justify-center gap-8">
                <!-- Form Column -->
                <div class="bg-white rounded-xl shadow-lg p-20">
                    <h2 class="text-3xl font-bold text-gray-800 mb-6">Accedi al tuo profilo</h2>
                    
                    <form x-data="{
                        email: '',
                        password: '',
                        showPassword: false, 
                    }" @submit.prevent="handleSubmit">
                        

                        <!-- Email -->
                        <div class="mb-6">
                            <label class="block text-gray-700 mb-2 font-medium">Email</label>
                            <input x-model="email" type="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg" placeholder="tu@email.com">
                        </div>

                        <!-- Password -->
                        <div class="mb-6">
                            <label class="block text-gray-700 mb-2 font-medium">Password</label>
                            <div class="relative">
                                <input x-model="password" x-bind:type="showPassword ? 'text' : 'password'" required class="w-full px-4 py-3 border border-gray-300 rounded-lg">

                                <button type="button" @click="showPassword = !showPassword" class="absolute right-3 top-3 text-gray-500 hover:text-purple-600">
                                    <i x-bind:class="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                                </button>
                            </div>
                           
                        </div>

                        <!-- Submit Button -->
                        <button x-bind:disabled="!(email && password)" type="submit" class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-500 text-white font-bold rounded-lg hover:shadow-lg transition-shadow disabled:opacity-50 disabled:cursor-not-allowed">
                            Accedi
                        </button>

                    </form>

                    <!-- Login Link -->
                    <div class="mt-8 text-center">
                        <span class="text-gray-600">Non hai un account?</span>
                        <a href="/marketplace/registration" class="ml-2 text-purple-600 font-medium hover:text-purple-800">
                            Registrati
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer (stesso del welcome page) -->
    <footer class="bg-gray-800 text-white py-8 mt-12">
        <div class="max-w-6xl mx-auto px-4 text-center text-sm text-gray-400">
            <p>ArtAround Marketplace - Esplora l'arte in modo personalizzato</p>
        </div>
    </footer>

    <script>
        // Funzione per gestire il login
        async function handleSubmit() {
            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: this.email,
                        password: this.password,
                    }),
                });
            
                if (res.ok) {
                    const resData = await res.json(); 

                    // Salva token e utente per Marketplace e Navigator
                    localStorage.setItem('apiToken', resData.data.token);
                    localStorage.setItem('token', resData.data.token);
                    localStorage.setItem('user', JSON.stringify(resData.data.user));
                    localStorage.setItem('userData', JSON.stringify(resData.data.user));
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirect = urlParams.get("redirect");
                    if (redirect) {
                        window.location.href = redirect;
                    } else {
                        window.location.href = "/marketplace/homepage";
                    }

                } else {
                    const errorData = await res.json();
                    alert("Errore durante l'accesso: " + (errorData.message || "Si è verificato un errore."));
                }

            } catch (error) {
                console.error('Unexpected error occured:', error);   
                alert('Errore di connessione al server.');
            }
        }
    </script>


</body>
</html>
