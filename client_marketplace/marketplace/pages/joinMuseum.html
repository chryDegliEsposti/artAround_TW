<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Museum join</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    
    <body class="bg-gray-50 min-h-screen flex flex-col">
        <main class="max-w-4xl mx-auto px-4 py-12 flex-grow" x-data="joinMuseumSearch()">
            <div class="mb-6">
                <a href="/marketplace/homepage" class="text-purple-600 hover:text-purple-800 flex items-center">
                    <i class="fas fa-arrow-left mr-2"></i> Torna alla Homepage
                </a>
            </div>
            
            <div class="bg-white rounded-2xl shadow-xl p-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-2 italic">Trova la tua Struttura</h2>
                <p class="text-gray-500 mb-8">Cerca un museo esistente per collaborare alla creazione di contenuti.</p>

                <div class="flex flex-col md:flex-row gap-0 mb-10 group">
                    <select x-model="searchField" 
                        class="bg-gray-100 border-2 border-transparent rounded-t-2xl md:rounded-l-2xl md:rounded-tr-none px-6 py-4 font-bold text-purple-700 outline-none focus:border-purple-500 transition-all cursor-pointer">
                        <option value="name">Nome Museo</option>
                        <option value="museumId">Codice Identificativo</option>
                    </select>

                    <div class="relative flex-1">
                        <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-purple-500 transition-colors"></i>
                        <input type="text" 
                            x-model="query" 
                            @input.debounce.400ms="search"
                            :placeholder="searchField === 'name' ? 'Digita il nome (es: Uffizi...)' : 'Digita il codice(es: MUCIV-01)'"
                            class="w-full pl-10 pr-14 py-4 bg-gray-50 rounded-b-2xl md:rounded-r-2xl md:rounded-bl-none border-2 border-transparent focus:border-purple-500 focus:bg-white outline-none transition-all text-sm md:text-lg shadow-inner"
                        >
                    </div>
                </div>

                <div class="space-y-4">
                    <template x-if="loading">
                        <div class="text-center py-10"><i class="fas fa-spinner animate-spin text-3xl text-purple-600"></i></div>
                    </template>

                    <template x-for="museum in results" :key="museum._id">
                        <div class="flex items-center justify-between p-4 border rounded-xl hover:bg-purple-50 transition group">
                            <div class="flex items-center space-x-4">
                                <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center text-purple-600">
                                    <i class="fas fa-university"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-gray-800" x-text="museum.name"></h4>
                                    <p class="text-sm text-gray-500" x-text="museum.city"></p>
                                </div>
                            </div>
                            <button @click="requestJoin(museum._id)" 
                                class="bg-white border-2 border-purple-600 text-purple-600 px-4 py-2 rounded-lg font-bold hover:bg-purple-600 hover:text-white transition">
                                Richiedi Accesso
                            </button>
                        </div>
                    </template>

                    <template x-if="query.length > 2 && results.length === 0 && !loading">
                        <div class="text-center py-10 text-gray-500 italic">Nessun museo trovato con questo nome.</div>
                    </template>
                </div>
            </div>
        </main>

        <!-- FOOTER -->
        <footer class="bg-gray-800 text-white py-8 mt-12">
            <div class="max-w-6xl mx-auto px-4 text-center text-sm text-gray-400">
                <p>ArtAround Marketplace - Esplora l'arte in modo personalizzato</p>
            </div>
        </footer>
        

        <script>
            function joinMuseumSearch() {
                return {
                    query: '',
                    searchField: 'name', // Default: ricerca per nome
                    results: [],
                    loading: false,

                    async search() {
                        // Iniziamo la ricerca solo dopo 3 caratteri per non intasare il server
                        if (this.query.length < 3) {
                            this.results = [];
                            return;
                        }

                        this.loading = true;
                        try {
                            // Passiamo q (valore) e field (nome o codice) alla tua API
                            const url = `/api/v1/marketplace/museums/search?q=${encodeURIComponent(this.query)}&field=${this.searchField}`;
                            const response = await fetch(url, {
                                headers: { 'Authorization': `Bearer ${localStorage.getItem('apiToken')}` }
                            });
                            
                            if (!response.ok) throw new Error('Errore nella ricerca');
                            
                            const data = await response.json();
                            this.results = data.data || [];
                        } catch (err) {
                            console.error("Errore:", err);
                            this.results = [];
                        } finally {
                            this.loading = false;
                        }
                    },

                    async requestJoin(museum) {
                        if (!confirm(`Vuoi richiedere l'accesso per collaborare con "${museum}"?`)) return;

                        try {
                            const response = await fetch(`/api/v1/marketplace/museums/join/${museum}`, {
                                method: 'POST',
                                headers: { 
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${localStorage.getItem('apiToken')}`
                                }
                            });

                            if (response.ok) {
                                alert('Richiesta inviata con successo! Riceverai una notifica quando verrai approvato.');
                                window.location.href = '/marketplace/homepage';

                            } else {
                                const err = await response.json();
                                alert(err.message || 'Errore nell\'invio della richiesta');
                            }
                        } catch (err) {
                            alert('Errore di connessione al server.');
                        }
                    }
                }
            }
        </script>

    </body>
</html>
