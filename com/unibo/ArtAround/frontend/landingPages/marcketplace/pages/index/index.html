<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtAround - Welcome</title>

    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="scene-container">
        <model-viewer id="hero-model" src="../../../../res/Sketchfab_2021_07_22_10_21_53.glb" alt="3D Art Piece"
            auto-rotate camera-controls disable-zoom interaction-prompt="none" shadow-intensity="1"
            camera-orbit="45deg 50deg 2.5m">
        </model-viewer>
    </div>

    <div class="content-overlay">
        <h1 class="title">ArtAround</h1>
        <button id="enter-btn" class="enter-button">Entra nel Sito</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
