<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtAround - Inserisci Museo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../home/style.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <a href="../home/home_museum_owner.html" class="logo">ArtAround <span
                style="font-size: 0.8em; opacity: 0.7;">Owner</span></a>
        <div class="menu-toggle">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-links">
            <li><a href="../home/home_user.html">Home</a></li>
            <li><a href="../museum_map/index.html">Mappa</a></li>
            <li><a href="../create_visit/create_visit.html">Crea Visita</a></li>
            <li><a href="../insert_museum/insert_museum.html">Inserisci Museo</a></li>
            <li><a href="../index/index.html">Landing</a></li>
        </ul>
    </nav>

    <main>
        <h1>Inserisci Nuovo Museo</h1>

        <form id="museum-form">
            <div class="form-group" style="position: relative;">
                <label for="nome">Nome Museo</label>
                <input type="text" id="nome" name="title" required>
                <ul id="museum-suggestions" class="suggestions-list"></ul>
            </div>

            <div class="form-group">
                <label for="description">Descrizione</label>
                <textarea id="description" name="description" rows="4"></textarea>
            </div>

            <div class="form-group" style="position: relative;">
                <label for="address">Indirizzo</label>
                <input type="text" id="address" name="address" autocomplete="off">
                <ul id="address-suggestions" class="suggestions-list"></ul>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="lat">Latitudine</label>
                    <input type="number" step="any" id="lat" name="lat">
                </div>
                <div class="form-group">
                    <label for="lon">Longitudine</label>
                    <input type="number" step="any" id="lon" name="lon">
                </div>
            </div>

            <div class="form-group">
                <label for="webSite">Sito Web</label>
                <input type="url" id="webSite" name="webSite">
            </div>

            <div class="form-group">
                <label for="mapLink">Link Mappa</label>
                <input type="url" id="mapLink" name="mapLink">
            </div>

            <div class="items-section">
                <h2>Opere d'Arte</h2>
                <button type="button" id="add-item-btn" class="btn-secondary">Aggiungi Opera</button>
                <ul id="items-list" class="items-list">

                </ul>
            </div>

            <button type="submit" class="btn-primary">Crea Museo</button>
        </form>
    </main>


    <div id="item-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <form id="item-form">

                <!-- STEP 1: Item Details -->
                <div id="modal-step-1" class="modal-step">
                    <h2>Aggiungi Opera - Dettagli (1/2)</h2>

                    <div class="form-group">
                        <label for="item-title">Titolo Opera</label>
                        <input type="text" id="item-title" required>
                    </div>

                    <!-- 9 Descriptions Grid -->
                    <h3>Descrizioni (9 Livelli)</h3>
                    <div class="descriptions-grid"
                        style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
                        <!-- Generated by JS or static? User said "0 text area" initially but implied manual entry is possible. 
                             Let's stick to the requirement: "9 descriptions (0 text area)... insert manually or generate AI" 
                             User might mean "9 text areas". "0 text area" likely a typo for "9". -->

                        <div class="desc-cell"><label>Short - Easy</label><textarea id="desc_short_easy"></textarea>
                        </div>
                        <div class="desc-cell"><label>Short - Medium</label><textarea id="desc_short_medium"></textarea>
                        </div>
                        <div class="desc-cell"><label>Short - Hard</label><textarea id="desc_short_hard"></textarea>
                        </div>

                        <div class="desc-cell"><label>Medium - Easy</label><textarea id="desc_medium_easy"></textarea>
                        </div>
                        <div class="desc-cell"><label>Medium - Medium</label><textarea
                                id="desc_medium_medium"></textarea></div>
                        <div class="desc-cell"><label>Medium - Hard</label><textarea id="desc_medium_hard"></textarea>
                        </div>

                        <div class="desc-cell"><label>Long - Easy</label><textarea id="desc_long_easy"></textarea></div>
                        <div class="desc-cell"><label>Long - Medium</label><textarea id="desc_long_medium"></textarea>
                        </div>
                        <div class="desc-cell"><label>Long - Hard</label><textarea id="desc_long_hard"></textarea></div>
                    </div>

                    <button type="button" class="btn-secondary" id="generate-descriptions-ai-btn"
                        style="margin-top: 10px;">Genera Descrizioni con AI</button>

                    <div style="margin-top: 20px; text-align: right;">
                        <button type="button" id="btn-next-step" class="btn-primary">Avanti</button>
                    </div>
                </div>

                <!-- STEP 2: Author Details -->
                <div id="modal-step-2" class="modal-step" style="display: none;">
                    <h2>Autore (2/2)</h2>

                    <div class="form-group" style="position: relative;">
                        <label for="item-author">Nome Autore</label>
                        <input type="text" id="item-author" required autocomplete="off">
                        <ul id="author-suggestions" class="suggestions-list"></ul>
                    </div>

                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="generate-author-ai" name="generate-author-ai">
                        <label for="generate-author-ai" style="display: inline; margin-left: 0.5rem;">Genera descrizioni
                            Autore con AI (Automatico)</label>
                    </div>

                    <div class="form-group">
                        <label for="author-desc-short">Descrizione Breve Autore</label>
                        <textarea id="author-desc-short" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="author-desc-long">Descrizione Lunga Autore (Biografia)</label>
                        <textarea id="author-desc-long" rows="6"></textarea>
                    </div>

                    <div style="margin-top: 20px; display: flex; justify-content: space-between;">
                        <button type="button" id="btn-prev-step" class="btn-secondary">Indietro</button>
                        <button type="submit" class="btn-primary">Aggiungi alla Lista</button>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <script src="../home/script.js"></script>
    <script src="script.js"></script>
</body>

</html>
