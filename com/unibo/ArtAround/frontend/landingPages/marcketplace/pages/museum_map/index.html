<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtAround - Mappa Musei</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>Esplora Musei</h2>
            <nav class="mini-nav" style="margin-bottom: 1rem;">
                <a href="../home/home_user.html" style="color: var(--color-primary); text-decoration: none;">&larr;
                    Home</a>
            </nav>
        </div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Cerca museo o indirizzo...">
        </div>
        <ul id="results-list">
            
        </ul>
    </div>

    
    <div id="map-container">
        <div id="miaMappa"></div>

        
        <div id="info-card">
            <button class="close-btn">&times;</button>
            <h3 id="card-title">Titolo Museo</h3>
            <p id="card-address" class="address">Indirizzo</p>
            <p id="card-description" class="description">Descrizione...</p>
            <a href="#" id="btn-directions" class="btn-directions" target="_blank">Ottieni Indicazioni</a>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="script.js"></script>
</body>

</html>
