<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtAround - Navigazione Museo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header>
        <nav>
            <a href="../home/home_user.html" class="back-link"><i class="fas fa-arrow-left"></i> Home</a>
            <h1>Esplora Dintorni</h1>
        </nav>
    </header>

    <main class="container">
        <!-- Controls Section -->
        <section class="controls-card">
            <div class="control-group">
                <label for="floor-select"><i class="fas fa-layer-group"></i> Piano Attuale</label>
                <div class="floor-selector">
                    <button id="floor-down" class="floor-btn">-</button>
                    <input type="number" id="floor-input" value="1" readonly>
                    <button id="floor-up" class="floor-btn">+</button>
                </div>
            </div>

            <div class="control-group">
                <label for="range-slider"><i class="fas fa-ruler"></i> Raggio di ricerca: <span
                        id="range-value">20</span>m</label>
                <input type="range" id="range-slider" min="5" max="100" value="20" step="5">
            </div>

            <button id="scan-btn" class="primary-btn">
                <i class="fas fa-radar"></i> Scansiona Dintorni
            </button>
        </section>

        <!-- Status/Error Message -->
        <div id="status-msg" class="status-msg"></div>

        <!-- Items List -->
        <section id="items-list" class="items-grid">
            <!-- Items will be injected here -->
            <div class="empty-state">
                <i class="fas fa-search-location"></i>
                <p>Premi "Scansiona Dintorni" per trovare opere vicine a te.</p>
            </div>
        </section>
    </main>

    <!-- Item Detail Modal -->
    <div id="item-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modal-title">Titolo Opera</h2>
            <p id="modal-author" class="subtitle">Autore</p>
            <div class="modal-body">
                <p id="modal-desc"></p>
                <div id="modal-meta"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
