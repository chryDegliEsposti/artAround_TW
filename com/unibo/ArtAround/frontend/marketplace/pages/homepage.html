<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ArtAround</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body class="bg-gray-50 min-h-screen flex flex-col" x-data="dashboard()" x-init="init()">
    
    <!-- Header -->
    <header class="bg-white shadow sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <!-- Logo -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-purple-600 rounded-lg flex items-center justify-center">
                    <i class="fas fa-palette text-white"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">ArtAround Dashboard</h1>
            </div>
            
            <!-- User Profile -->
            <div class="relative" x-data="{ 
                isProfileMenuOpen: false, 
                async handleLogout() {
                    if (confirm('Sei sicuro di voler uscire?')) {
                        try {
                            await fetch('/api/v1/auth/logout'); 
                            localStorage.clear() //instead of single item removal 
                            window.location.href = '/marketplace/homepage';
                        } catch (err) {
                            console.error('Error during logout attempt: ', err);
                        }
                    }
                }
            }">

                <!-- Pulsante profilo che apre il menu -->
                <button @click="isProfileMenuOpen = !isProfileMenuOpen" 
                        class="flex items-center space-x-3 focus:outline-none">
                    <span class="text-gray-600 hidden md:block">Benvenuto,</span>
                    <span class="font-bold text-purple-600">Artista</span>
                    <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center hover:bg-purple-200 transition">
                        <i class="fas fa-user text-purple-600"></i>
                    </div>
                    <!-- Icona freccia per indicare menu -->
                    <i class="fas fa-chevron-down text-gray-500 text-sm transition-transform"
                    :class="{ 'rotate-180': isProfileMenuOpen }"></i>
                </button>

                <!-- Menu a tendina (mostrato/nascosto con Alpine) -->
                <div x-cloak x-show="isProfileMenuOpen" @click.away="isProfileMenuOpen = false" class="absolute right-0 mt-2 w-64 bg-white rounded-lg shadow-xl border py-2 z-50">  
                    <!-- Info utente (opzionale) -->
                    <div class="px-4 py-3 border-b">
                        <p class="text-sm text-gray-500">Sei connesso come</p>
                        <p class="font-medium text-gray-800">Artista</p>
                        <p class="text-sm text-gray-600">artista@email.com</p>
                    </div>
                    
                    <!-- Link del menu -->
                    <a href="profile.html" class="block px-4 py-3 hover:bg-gray-50 transition flex items-center">
                        <i class="fas fa-user-circle w-6 text-gray-500"></i>
                        <span class="ml-3">Il mio profilo</span>
                    </a>
                    
                    <a href="settings.html" class="block px-4 py-3 hover:bg-gray-50 transition flex items-center">
                        <i class="fas fa-cog w-6 text-gray-500"></i>
                        <span class="ml-3">Impostazioni</span>
                    </a>
                    
                    <a href="my-visits.html" class="block px-4 py-3 hover:bg-gray-50 transition flex items-center">
                        <i class="fas fa-palette w-6 text-gray-500"></i>
                        <span class="ml-3">Le mie visite</span>
                    </a>
                    
                    <!-- Divisore -->
                    <div class="border-t my-2"></div>
                    
                    <!-- Logout (con azione) -->
                    <button @click="handleLogout" 
                            class="w-full text-left px-4 py-3 hover:bg-red-50 transition flex items-center text-red-600">
                        <i class="fas fa-sign-out-alt w-6"></i>
                        <span class="ml-3">Logout</span>
                    </button>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="bg-gray-800 text-white sticky top-16 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <div class="flex items-center flex-wrap gap-6">
                <a href="index.html" class="hover:text-purple-400 flex items-center">
                    <i class="fas fa-chart-pie mr-2"></i>Dashboard</a>

                <a href="browseMarket" class="hover:text-purple-400 flex items-center">
                    <i class="fas fa-search mr-2"></i>Browse Contenuti</a>
                
                <!-- TODO module sections 
                <template x-if="is('creator')">
                    <section id="creator-tools">
                        <h2 class="text-xl font-bold">I tuoi Musei</h2>
                        </section>
                </template>

                <template x-if="is('teacher')">
                    <section id="teacher-tools">
                        <h2 class="text-xl font-bold">Le tue Classi</h2>
                        </section>
                </template>

                <template x-if="is('visitor')">
                    <section id="visitor-feed">
                        <h2 class="text-xl font-bold">Esplora Musei</h2>
                        </section>
                </template>
                -->
               
                <template x-if="userRole === 'creator'"> 
                    <div class="inline-flex items-center space-x-6">
                        <a href="editor.html" class="hover:text-purple-400 flex items-center">
                            <i class="fas fa-edit mr-2"></i>Editor Visite</a>

                        <div class="relative" x-data="{ isCreateMenuOpen: false }">
                            <button @click="isCreateMenuOpen = !isCreateMenuOpen" 
                                    class="hover:text-purple-400 flex items-center focus:outline-none">
                                <i class="fas fa-plus-circle mr-2"></i>
                                Crea contenuti
                                <i class="fas fa-chevron-down ml-2 text-sm transition-transform"
                                :class="{ 'rotate-180': isCreateMenuOpen }"></i>
                            </button>

                            <!-- Menu a tendina compatto -->
                            <div x-show="isCreateMenuOpen"
                                x-transition
                                @click.away="isCreateMenuOpen = false"
                                class="absolute left-0 mt-2 w-48 bg-white rounded-lg shadow-lg border py-1 z-50">
                                
                                <a href="/marketplace/homepage/createItems" 
                                    @click="isCreateMenuOpen = false"
                                    class="block px-4 py-3 hover:bg-gray-100 text-gray-700">
                                    <i class="fas fa-cube mr-3 text-blue-500"></i>
                                    Crea Items
                                </a>
                                
                                <a href="/marketplace/homepage/createVisits" 
                                    @click="isCreateMenuOpen = false"
                                    class="block px-4 py-3 hover:bg-gray-100 text-gray-700 border-t">
                                    <i class="fas fa-map-marked-alt mr-3 text-green-500"></i>
                                    Imposta Visite
                                </a>
                            </div>
                        </div>
                        
                        <!-- Menu opzioni Musei -->
                        <div class="relative" x-data="{ isMuseumMenuOpen: false }" x-show="userRole === 'creator' || userRole === 'owner'">
                            <button @click="isMuseumMenuOpen = !isMuseumMenuOpen" 
                                    class="hover:text-purple-400 flex items-center focus:outline-none transition">
                                <i class="fas fa-university mr-2"></i>
                                I miei Musei
                                <i class="fas fa-chevron-down ml-2 text-sm transition-transform"
                                :class="{ 'rotate-180': isMuseumMenuOpen }"></i>
                            </button>

                            <div x-show="isMuseumMenuOpen"
                                x-transition
                                @click.away="isMuseumMenuOpen = false"
                                class="absolute left-0 mt-2 w-48 bg-white rounded-lg shadow-lg border py-1 z-50">
                                
                                <a href="/marketplace/homepage/newMuseum" 
                                    @click="isCreateMenuOpen = false"
                                    class="block px-4 py-3 hover:bg-gray-100 text-gray-700 border-b">
                                    <i class="fas fa-plus-circle mr-3 text-purple-500"></i>
                                    Crea Nuovo
                                </a>

                                <a href="/marketplace/homepage/joinMuseum" 
                                    @click="isCreateMenuOpen = false"
                                    class="block px-4 py-3 hover:bg-gray-100 text-gray-700 border-b">
                                    <i class="fas fa-handshake mr-3 text-blue-600"></i>
                                    Unisciti
                                </a>

                                <a href="/marketplace/homepage/myMuseums" 
                                    @click="isCreateMenuOpen = false"
                                    class="block px-4 py-3 hover:bg-gray-100 text-gray-700">
                                    <i class="fas fa-list mr-3 text-green-600"></i>
                                    Lista musei
                                </a>
                                <!-- OPTIONAL, MAYBE: manage personal museum(s) -->
                                <template x-for="museum in myMuseums" :key="museum._id">
                                    <a :href="'/marketplace/homepage/museum/' + museum._id" class="block px-4 py-3 hover:bg-gray-100 border-b border-gray-50 last:border-0">
                                        <div class="flex justify-between items-center">
                                            <span class="font-medium" x-text="museum.name"></span>
                                            <i class="fas fa-chevron-right text-[10px] text-gray-300"></i>
                                        </div>
                                    </a>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Notification section -->
                <div x-data="notificationManager()" class="relative ml-auto h-full">
                    <button @click="open = !open" class="relative p-2 text-gray-300 hover:text-purple-400 focus:outline-none">
                        <i class="fas fa-bell text-xl"></i>
                        <template x-if="unreadCount > 0">
                            <span class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-red-600 rounded-full" 
                                x-text="unreadCount">
                            </span>
                        </template>
                    </button>

                    <div x-show="open" 
                        @click.away="open = false"
                        x-transition:enter="transition ease-out duration-200"
                        x-transition:enter-start="opacity-0 scale-95"
                        x-transition:enter-end="opacity-100 scale-100"
                        class="absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-2xl border border-gray-100 z-50 overflow-hidden">
                        
                        <div class="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                            <span class="font-bold text-gray-800">Notifiche</span>
                            <span class="text-xs text-blue-600 cursor-pointer hover:underline">Segna tutte come lette</span>
                        </div>

                        <div class="max-h-96 overflow-y-auto">
                            <template x-for="n in notifications" :key="n._id">
                                <div @click="markAsRead(n._id)" 
                                    class="p-4 border-b border-gray-50 cursor-pointer hover:bg-gray-50 transition"
                                    :class="n.read ? 'bg-white' : 'bg-blue-50'">
                                    
                                    <div class="flex items-start gap-3">
                                        <div class="mt-1">
                                            <template x-if="n.type === 'join_accepted'">
                                                <i class="fas fa-check-circle text-green-500"></i>
                                            </template>
                                            <template x-if="n.type === 'join_rejected'">
                                                <i class="fas fa-times-circle text-red-500"></i>
                                            </template>
                                        </div>
                                        
                                        <div class="flex-1">
                                            <p class="text-sm text-gray-800" x-text="n.message"></p>
                                            <p class="text-[10px] text-gray-400 mt-1" x-text="new Date(n.createdAt).toLocaleString('it-IT')"></p>
                                        </div>

                                        <template x-if="!n.read">
                                            <div class="w-2 h-2 bg-blue-600 rounded-full mt-2"></div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <template x-if="notifications.length === 0">
                                <div class="p-8 text-center text-gray-400">
                                    <i class="fas fa-bell-slash mb-2 text-2xl"></i>
                                    <p class="text-sm">Nessuna notifica</p>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </nav>
 
    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <!-- CREATOR MAIN SECTION VIEW -->
        <template x-if="userRole === 'creator'">
            <div>
            <!-- Welcome Section (personalizzata) -->
            <div class="bg-gradient-to-r from-purple-600 to-pink-500 rounded-2xl text-white p-8 mb-8 shadow-lg">
                <div class="flex items-start justify-between">
                    <div>
                        <h1 class="text-3xl font-bold mb-2">
                            Ciao, <span x-text="username || 'Artista'"></span>! 👋
                        </h1>
                        <p class="text-purple-100 max-w-2xl">
                            Bentornato su ArtAround. Ecco cosa sta succedendo con le tue visite e il tuo profilo.
                        </p>
                    </div>
                    <div class="hidden md:block bg-white bg-opacity-20 rounded-xl p-4 backdrop-blur-sm">
                        <i class="fas fa-palette text-4xl"></i>
                    </div>
                </div>
                
                <!-- Stats rapide -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
                    <div class="bg-white bg-opacity-10 rounded-lg p-4">
                        <div class="text-2xl font-bold">12</div>
                        <div class="text-sm opacity-90">Visite salvate</div>
                    </div>
                    <div class="bg-white bg-opacity-10 rounded-lg p-4">
                        <div class="text-2xl font-bold">5</div>
                        <div class="text-sm opacity-90">In corso</div>
                    </div>
                    <div class="bg-white bg-opacity-10 rounded-lg p-4">
                        <div class="text-2xl font-bold">3</div>
                        <div class="text-sm opacity-90">Acquistate</div>
                    </div>
                    <div class="bg-white bg-opacity-10 rounded-lg p-4">
                        <div class="text-2xl font-bold">8</div>
                        <div class="text-sm opacity-90">Create</div>
                    </div>
                </div>
            </div>

            <!-- Sezione Visite Salvate -->
            <div class="mb-12">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800 flex items-center">
                        <i class="fas fa-bookmark text-yellow-500 mr-3"></i>
                        Visite Salvate
                    </h2>
                    <a href="browse.html" class="text-purple-600 hover:text-purple-800 flex items-center">
                        Vedi tutte <i class="fas fa-arrow-right ml-2"></i>
                    </a>
                </div>

                <!-- Grid Visite Salvate (stile cards come welcome page) -->
                <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Card 1 -->
                    <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition">
                        <img src="https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?auto=format&fit=crop&w=600&h=400&q=80" 
                            alt="Arte" class="w-full h-48 object-cover">
                        <div class="p-5">
                            <h3 class="font-bold text-lg mb-2">Sera a Venezia</h3>
                            <p class="text-gray-600 text-sm mb-3">Pittura a olio • Marta Rossi</p>
                            <div class="flex justify-between items-center">
                                <span class="text-purple-600 font-bold">€ 850</span>
                                <button class="text-gray-400 hover:text-red-500">
                                    <i class="fas fa-heart"></i>
                                </button>
                            </div>
                            <div class="flex items-center justify-between mt-4 pt-4 border-t">
                                <span class="text-sm text-gray-500">
                                    <i class="far fa-clock mr-1"></i>Salvato ieri
                                </span>
                                <button class="text-purple-600 hover:text-purple-800 text-sm">
                                    Dettagli <i class="fas fa-chevron-right ml-1"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Card 2 -->
                    <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition">
                        <img src="https://images.unsplash.com/photo-1541961017774-22349e4a1262?auto=format&fit=crop&w=600&h=400&q=80" 
                            alt="Scultura" class="w-full h-48 object-cover">
                        <div class="p-5">
                            <h3 class="font-bold text-lg mb-2">Forma Libera</h3>
                            <p class="text-gray-600 text-sm mb-3">Scultura • Luca Bianchi</p>
                            <div class="flex justify-between items-center">
                                <span class="text-purple-600 font-bold">€ 1.200</span>
                                <button class="text-gray-400 hover:text-red-500">
                                    <i class="far fa-heart"></i>
                                </button>
                            </div>
                            <div class="flex items-center justify-between mt-4 pt-4 border-t">
                                <span class="text-sm text-gray-500">
                                    <i class="far fa-clock mr-1"></i>Salvato 3 giorni fa
                                </span>
                                <button class="text-purple-600 hover:text-purple-800 text-sm">
                                    Dettagli <i class="fas fa-chevron-right ml-1"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Card 3 -->
                    <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition">
                        <img src="https://images.unsplash.com/photo-1515405295579-ba7b45403062?auto=format&fit=crop&w=600&h=400&q=80" 
                            alt="Acquerello" class="w-full h-48 object-cover">
                        <div class="p-5">
                            <h3 class="font-bold text-lg mb-2">Giardino Segreto</h3>
                            <p class="text-gray-600 text-sm mb-3">Acquerello • Sofia Verdi</p>
                            <div class="flex justify-between items-center">
                                <span class="text-purple-600 font-bold">€ 450</span>
                                <button class="text-gray-400 hover:text-red-500">
                                    <i class="fas fa-heart"></i>
                                </button>
                            </div>
                            <div class="flex items-center justify-between mt-4 pt-4 border-t">
                                <span class="text-sm text-gray-500">
                                    <i class="far fa-clock mr-1"></i>Salvato oggi
                                </span>
                                <button class="text-purple-600 hover:text-purple-800 text-sm">
                                    Dettagli <i class="fas fa-chevron-right ml-1"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sezione Attività Recenti -->
            <div class="grid md:grid-cols-3 gap-8">
                <!-- Le tue visite create -->
                <div class="md:col-span-2 bg-white rounded-xl shadow-md p-6">
                    <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <i class="fas fa-pencil-alt text-purple-600 mr-3"></i>
                        Le tue visite create
                    </h3>
                    
                    <div class="space-y-4">
                        <div class="flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg">
                            <div class="flex items-center">
                                <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center mr-4">
                                    <i class="fas fa-landmark text-purple-600"></i>
                                </div>
                                <div>
                                    <h4 class="font-medium">Museo Egizio - Torino</h4>
                                    <p class="text-sm text-gray-500">Completata • 234 visualizzazioni</p>
                                </div>
                            </div>
                            <span class="text-green-500 text-sm font-medium">Pubblicata</span>
                        </div>

                        <div class="flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg">
                            <div class="flex items-center">
                                <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center mr-4">
                                    <i class="fas fa-university text-blue-600"></i>
                                </div>
                                <div>
                                    <h4 class="font-medium">Galleria degli Uffizi</h4>
                                    <p class="text-sm text-gray-500">In lavorazione • Bozza</p>
                                </div>
                            </div>
                            <span class="text-yellow-500 text-sm font-medium">In corso</span>
                        </div>

                        <div class="flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg">
                            <div class="flex items-center">
                                <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center mr-4">
                                    <i class="fas fa-church text-green-600"></i>
                                </div>
                                <div>
                                    <h4 class="font-medium">Duomo di Milano</h4>
                                    <p class="text-sm text-gray-500">In revisione • 3 commenti</p>
                                </div>
                            </div>
                            <span class="text-purple-500 text-sm font-medium">In revisione</span>
                        </div>
                    </div>

                    <button class="mt-6 text-purple-600 hover:text-purple-800 font-medium flex items-center">
                        <i class="fas fa-plus mr-2"></i>Crea nuova visita
                    </button>
                </div>

                <!-- Statistiche e Quick Actions -->
                <div class="space-y-6">
                    <!-- Statistiche rapide -->
                    <div class="bg-white rounded-xl shadow-md p-6">
                        <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                            <i class="fas fa-chart-line text-green-500 mr-3"></i>
                            Statistiche
                        </h3>
                        
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <span class="text-gray-600">Visualizzazioni totali</span>
                                <span class="font-bold text-gray-800">1,234</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-gray-600">Acquisti ricevuti</span>
                                <span class="font-bold text-gray-800">47</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-gray-600">Recensioni</span>
                                <span class="font-bold text-gray-800">4.8 ★</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2 mt-2">
                                <div class="bg-purple-600 h-2 rounded-full" style="width: 78%"></div>
                            </div>
                            <p class="text-sm text-gray-500">78% di crescita questo mese</p>
                        </div>
                    </div>
                    

                    <!-- Quick Actions -->
                    <div class="bg-gradient-to-r from-purple-600 to-pink-500 rounded-xl shadow-md p-6 text-white">
                        <h3 class="text-xl font-bold mb-4">Azioni rapide</h3>
                        
                        <div class="space-y-3">
                            <button class="w-full bg-white bg-opacity-20 hover:bg-opacity-30 rounded-lg p-3 flex items-center transition">
                                <i class="fas fa-upload mr-3"></i>
                                Pubblica una nuova visita
                            </button>
                            <button class="w-full bg-white bg-opacity-20 hover:bg-opacity-30 rounded-lg p-3 flex items-center transition">
                                <i class="fas fa-palette mr-3"></i>
                                Modifica bozza
                            </button>
                            <button class="w-full bg-white bg-opacity-20 hover:bg-opacity-30 rounded-lg p-3 flex items-center transition">
                                <i class="fas fa-chart-bar mr-3"></i>
                                Vedi report completo
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </template>

        <!-- VISITOR MAIN SECTION VIEW -->
        <template x-if="userRole === 'visitor'">
            <section class="mb-10">
                <div class="mb-5">
                    <p class="text-sm font-semibold text-purple-600 uppercase tracking-wide">Area visitatore/studente</p>

                    <h2 class="text-2xl font-bold text-gray-800 mt-1">
                    I tuoi strumenti
                    </h2>

                    <p class="text-gray-500 text-sm mt-1">
                    Gestisci le tue classi e accedi alle attività preparate dai docenti.
                    </p>
                </div>

                <div class="flex flex-wrap gap-3">
                    <a href="/marketplace/homepage/joinClassroom"
                    class="inline-flex items-center gap-3 px-5 py-3 bg-purple-600 text-white rounded-lg font-semibold
                            hover:bg-purple-700 focus:ring-4 focus:ring-purple-200 transition">

                    <span class="w-8 h-8 rounded-md bg-white/20 flex items-center justify-center">

        function notificationManager() {
            return {
                notifications: [],
                open: false,
                
                async init() {
                    await this.fetchNotifications();
                    // Opzionale: controlla nuove notifiche ogni 30 secondi
                    setInterval(() => this.fetchNotifications(), 30000);
                },

                async fetchNotifications() {
                    try {
                        const res = await fetch('/api/v1/marketplace/notifications', {
                            headers: { 'Authorization': `Bearer ${localStorage.getItem('apiToken')}` }
                        });
                        const json = await res.json();
                        if (json.status === 'success') {
                            this.notifications = json.data;
                        }
                    } catch (err) {
                        console.error("Errore recupero notifiche:", err);
                    }
                },

                get unreadCount() {
                    return this.notifications.filter(n => !n.read).length;
                },

                async markAsRead(id) {
                    try {
                        await fetch(`/api/v1/marketplace/notifications/markAsRead/${id}`, {
                            method: 'PATCH',
                            headers: { 'Authorization': `Bearer ${localStorage.getItem('apiToken')}` }
                        });
                        // Aggiorna lo stato locale senza ricaricare tutto
                        const notif = this.notifications.find(n => n._id === id);
                        if (notif) notif.read = true;
                    } catch (err) {
                        console.error("Errore lettura notifica:", err);
                    }
                }
            }
        }
