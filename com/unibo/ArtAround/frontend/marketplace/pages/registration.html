<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrati</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>

<body class="bg-gray-50 min-h-screen">
    
    <!-- NAVBAR -->
    <nav class="sticky top-0 z-50 bg-gray-100 shadow-lg">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                
                <!-- Logo che porta alla home -->
                <a href="/marketplace" class="flex items-center space-x-2">
                    <div class="w-7 h-7 sm:w-8 sm:h-8 bg-purple-600 rounded-lg flex items-center justify-center">
                        <i class="text-white text-xs">AA</i>
                    </div>
                    <span class="text-l sm:text-xl lg:text-2xl font-bold text-gray-800 hover:text-purple-600">Marketplace</span>
                </a>

                <!-- Link per tornare alla home -->
                <div class="hidden md:flex items-center space-x-6">
                    <a href="/marketplace" class="text-gray-600 hover:text-purple-600">
                        <i class="fas fa-arrow-left mr-2"></i>Torna alla Home
                    </a>
                </div>

                <!-- Hai già un account? -->
                <div class="hidden md:flex items-center space-x-2">
                    <span class="text-gray-600">Hai già un account?</span>
                    <a href="/marketplace/login">
                        <button class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                            Accedi
                        </button>
                    </a>
                </div>

            </div>
        </div>
    </nav>

    <!-- Form Registrazione -->
    <section class="py-12">
        <div class="max-w-4xl mx-auto px-4">
            
            <!-- Header -->
            <div class="text-center mb-10">
                <h1 class="text-4xl font-bold text-gray-800 mb-4">
                    Unisciti alla Community ArtAround
                </h1>
                <p class="text-gray-600 text-lg">
                    Crea subito il tuo account per iniziare a esplorare e creare visite museali
                </p>
            </div>

            <div class="flex justify-center gap-8">
                <!-- Form Column -->
                <div class="bg-white rounded-xl shadow-lg p-8">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">Crea Account</h2>
                    
                    <form x-data="{
                        email: '',
                        username: '',
                        password: '',
                        userType: 'visitor', 
                        confirmPassword: '', 
                        showPassword: false, 
                        showConfirmPassword: false,
                    }" @submit.prevent="handleSubmit">
                        
                        <!-- Username profilo -->
                        <div class="mb-6">
                            <div>
                                <label class="w-full text-gray-700 mb-2 font-medium">Username</label>
                                <input x-model="username" type="text" required class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-6">
                            <label class="block text-gray-700 mb-2 font-medium">Email</label>
                            <input x-model="email" type="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg" placeholder="tu@email.com">
                        </div>

                        <!-- Password -->
                        <div class="mb-6">
                            <label class="block text-gray-700 mb-2 font-medium">Password</label>
                            <div class="relative">
                                <input x-model="password" x-bind:type="showPassword ? 'text' : 'password'" required class="w-full px-4 py-3 border border-gray-300 rounded-lg">

                                <button type="button" @click="showPassword = !showPassword"
                                        class="absolute right-3 top-3 text-gray-500 hover:text-purple-600">
                                    <i x-bind:class="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                                </button>
                            </div>
                            <div class="mt-2 text-sm text-gray-500">
                                <div class="flex items-center mt-1" x-bind:class="password.length >= 8 ? 'text-green-600' : 'text-gray-400'">
                                    <i class="fas fa-check-circle mr-2"></i>
                                    Almeno 8 caratteri
                                </div>
                            </div>
                        </div>

                        <!-- Conferma Password -->
                        <div class="mb-6">
                            <label class="block text-gray-700 mb-2 font-medium">Conferma Password</label>
                            <div class="relative">
                                <input x-model="confirmPassword" x-bind:type="showConfirmPassword ? 'text' : 'password'" required class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                                <button type="button" @click="showConfirmPassword = !showConfirmPassword" class="absolute right-3 top-3 text-gray-500 hover:text-purple-600">
                                    <i x-bind:class="showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                                </button>
                            </div>
                            <div x-show="password && confirmPassword && password !== confirmPassword" class="mt-2 text-sm text-red-600">
                                <i class="fas fa-exclamation-circle mr-1"></i> Le password non coincidono
                            </div>
                        </div>

                        <!-- Tipo Utente -->
                        <div class="mb-6">
                            <label class="block text-gray-700 mb-2 font-medium">Sono un...</label>
                            <div class="grid grid-cols-3 gap-3">
                                <label class="flex items-center p-4 border rounded-lg cursor-pointer hover:bg-gray-50">
                                    <input x-model="userType" type="radio" name="userType" value="admin" class="mr-3 text-purple-600 focus:ring-purple-500">
                                    <div>
                                        <div class="font-medium">Creatore</div>
                                        <div class="text-sm text-gray-500">Voglio creare visite</div>
                                    </div>
                                </label>
                                <label class="flex items-center p-4 border rounded-lg cursor-pointer hover:bg-gray-50">
                                    <input x-model="userType" type="radio" name="userType" value="teacher" class="mr-3 text-purple-600 focus:ring-purple-500">
                                    <div>
                                        <div class="font-medium">Insegnante</div>
                                        <div class="text-sm text-gray-500">Voglio gestire gite</div>
                                    </div>
                                </label>
                                <label class="flex items-center p-4 border rounded-lg cursor-pointer hover:bg-gray-50">
                                    <input x-model="userType" type="radio" name="userType" value="visitor" class="mr-3 text-purple-600 focus:ring-purple-500">
                                    <div>
                                        <div class="font-medium">Visitatore</div>
                                        <div class="text-sm text-gray-500">Voglio esplorare visite</div>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button x-bind:disabled="password && !(password.length()>=8) && confirmPassword && (password !== confirmPassword)" type="submit" class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-500 text-white font-bold rounded-lg hover:shadow-lg transition-shadow disabled:opacity-50 disabled:cursor-not-allowed">
                            Crea Account
                        </button>

                    </form>

                    <!-- Login Link -->
                    <div class="mt-8 text-center">
                        <span class="text-gray-600">Hai già un account?</span>
                        <a href="/marketplace/login" class="ml-2 text-purple-600 font-medium hover:text-purple-800">
                            Accedi qui
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer (stesso del welcome page) -->
    <footer class="bg-gray-800 text-white py-12"></footer>

    <script>
        // Funzione per gestire la registrazione
        async function handleSubmit() {
            try{
                const res = await fetch('/api/v1/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: this.email,
                        username: this.username,
                        password: this.password,
                        role: this.userType,
                    }),
                });
            
                if(res.ok){
                    alert('Registrazione avvenuta con successo!');
                    const resData = await res.json(); //to use in dashboard...

                    if(resData.data.token && resData.data.user){
                        localStorage.setItem('token', resData.data.token);
                        localStorage.setItem('userData', JSON.stringify(resData.data.user));
                        window.location.href = '/marketplace/homepage';
                        //NOT AUTH pk non do il token nelle requests??
                    }
                }else{
                    const errorData = await res.json();
                    alert('Errore nella registrazione: ' + (errorData.message || 'Si è verificato un errore.'));
                }

            }catch(error){
                console.error('Unexpected error occured:', error);   
            }
            

        }
    </script>

</body>
</html>
