<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My museums</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body>
        <main class="max-w-5xl mx-auto px-4 py-12" x-data="myMuseumsManager()">
           
            <h2 class="text-3xl font-bold text-gray-800 italic">I Miei Musei</h2>
    
            <div class="space-y-4">
                <template x-for="museum in museums" :key="museum._id">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="p-5 flex justify-between items-center cursor-pointer hover:bg-gray-50 transition"
                            @click="museum.creator === userId ? toggleMuseum(museum._id) : null">
                            <div class="flex items-center space-x-4">
                                <div :class="museum.creator === userId ? 'bg-purple-100 text-purple-600' : 'bg-blue-100 text-blue-600'" 
                                    class="w-12 h-12 rounded-xl flex items-center justify-center">
                                    <i class="fas fa-university text-xl"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-gray-800 text-lg" x-text="museum.name"></h4>
                                    <p class="text-xs text-gray-400 uppercase tracking-tighter" 
                                    x-text="museum.creator === userId ? '👑 Proprietario' : '👥 Collaboratore'"></p>
                                </div>
                            </div>
                            
                            <!-- Icons at the end of each museum entry card -->
                            <div class="flex items-center space-x-4">
                                <!-- requests number-->
                                <template x-if="museum.creator === userId && museum.pendingRequests && museum.pendingRequests.length > 0">
                                    <span class="bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded-full animate-bounce" 
                                        x-text="museum.pendingRequests.length + ' richieste'"></span>
                                </template>
                                <!-- click-to-open indicator-->
                                <template x-if="museum.creator === userId">
                                    <i class="fas fa-chevron-down text-gray-300 transition-transform" 
                                    :class="openMuseum === museum._id ? 'rotate-180' : ''"></i>
                                </template>
                            </div>
                        </div>

                        <!-- On click museum info card opening -->
                        <div x-show="openMuseum === museum._id" x-cloak class="bg-gray-50 border-t border-gray-100">
                            <div class="p-6">
                                <h5 class="text-sm font-black text-gray-400 uppercase mb-4">Richieste di Collaborazione</h5>
                                
                                <div class="space-y-3">
                                    <template x-for="req in museum.pendingRequests" :key="req._id">
                                        <div class="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center">
                                            <!-- requesting user info-->
                                            <div class="flex items-center space-x-3">
                                                <div class="text-xs font-mono bg-gray-100 px-2 py-1 rounded" x-text="'ID: ' + req.userId?._id"></div>
                                                <p class="font-bold text-gray-700" x-text="req.userId?.username"></p>
                                                <p class="font-bold text-gray-700" x-text="req.userId?.email"></p>
                                            </div>
                                            <!-- accept/refuse-->
                                            <div class="flex gap-2">
                                                <button @click="handleAction(museum._id, req._id, 'accept')" 
                                                    class="bg-green-500 text-white px-4 py-1.5 rounded-lg text-xs font-bold hover:bg-green-600 transition">Accetta</button>
                                                <button @click="handleAction(museum._id, req._id, 'reject')" 
                                                    class="bg-gray-200 text-gray-600 px-4 py-1.5 rounded-lg text-xs font-bold hover:bg-gray-300 transition">Rifiuta</button>
                                            </div>
                                        </div>
                                    </template>
                                    
                                    <template x-if="museum.pendingRequests && museum.pendingRequests.length === 0">
                                        <p class="text-center text-gray-400 text-sm py-4 italic">Nessuna richiesta in sospeso.</p>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </main>

        <!-- FOOTER -->
        <footer class="bg-gray-800 text-white py-8 mt-12">
            <div class="max-w-6xl mx-auto px-4 text-center text-sm text-gray-400">
                <p>ArtAround Marketplace - Esplora l'arte in modo personalizzato</p>
            </div>
        </footer>


        <script>
            function myMuseumsManager() {
                return {
                    museums: [],
                    userId: '',
                    openMuseum: null, // Tiene traccia di quale "tendina" è aperta

                    async init() {
                        const userData = JSON.parse(localStorage.getItem('user') || '{}');
                        this.userId = userData.id;
                        await this.loadMuseums();
                    },

                    async loadMuseums() {
                        try {
                            // Questa rotta deve restituire sia i musei posseduti che quelli collaborati
                            const res = await fetch('/api/v1/marketplace/museums/getManaged', {
                                headers: { 'Authorization': `Bearer ${localStorage.getItem('apiToken')}` }
                            });
                            const json = await res.json();
                            this.museums = json.data;
                            console.log("Musei caricati: ", this.museums);

                        } catch (err) {
                            console.error("Errore caricamento musei");
                        }
                    },

                    toggleMuseum(id) {
                        this.openMuseum = this.openMuseum === id ? null : id;
                    },

                    async handleAction(museumId, requestId, action) {
                        try {
                            const res = await fetch('/api/v1/marketplace/museums/handleJoinRequest', {
                                method: 'POST',
                                headers: { 
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${localStorage.getItem('apiToken')}`
                                },
                                body: JSON.stringify({ museumId, requestId, action })
                            });

                            const result = await res.json();
                            if (res.ok) {
                                alert(result.message);
                                // Ricarichiamo i dati per aggiornare la lista
                                await this.loadMuseums();
                            }
                        } catch (err) {
                            alert("Errore nell'operazione");
                        }
                    }
                }
            }
        </script>
    </body>
</html>
